name: Publish IG to GitHub Pages

# Builds the guide with the same pinned IG Publisher as ./build.sh and publishes output/ to
# https://e-medlab.github.io/mental-ig/, with the questionnaire viewer at /viewer/. A build with QA
# errors is not published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push supersedes a queued one but never cancels a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The publisher JAR (~230 MB) is version-stamped in build.sh, so its name is the cache key.
      - name: Cache IG Publisher
        uses: actions/cache@v4
        with:
          path: input-cache
          key: ig-publisher-${{ hashFiles('build.sh') }}

      - name: Build the guide
        run: ./build.sh

      - name: Fail on QA errors
        run: |
          errs=$(python3 -c "import json; print(json.load(open('output/qa.json'))['errs'])")
          echo "QA errors: $errs (details in output/qa.html)"
          [ "$errs" = "0" ]

      # The questionnaire viewer (viewer/) is published inside the guide at /mental-ig/viewer/. Its
      # HelexEMR renderer packages come from GitHub Packages, which needs a token even to read.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build the questionnaire viewer
        working-directory: viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HELEX_PACKAGES_TOKEN }}
        run: |
          npm ci
          npm run build
          cp -R dist ../output/viewer

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
